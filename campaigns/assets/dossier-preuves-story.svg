xt><path d="M40 306 H886" stroke="#d6dfcf"/><text x="40" y="357" font-family="Arial,sans-serif" font-size="25" fill="#526b5c" >Coût livré</text><text x="886" y="357" font-family="Arial,sans-serif" font-size="27" fill="#153c32" text-anchor="end">14,95 € HT indicatifs</text><path d="M40 380 H886" stroke="#d6dfcf"/><text x="40" y="431" font-family="Arial,sans-serif" font-size="25" fill="#526b5c" >Qualité réelle</text><text x="886" y="431" font-family="Arial,sans-serif" font-size="27" fill="#153c32" text-anchor="end">À vérifier</text><path d="M40 454 H886" stroke="#d6dfcf"/><rect x="40" y="515" width="856" height="57" rx="12" fill="#e8ede1" /><text x="468" y="551" font-family="Arial,sans-serif" font-size="24" fill="#153c32" text-anchor="middle">Exportez le dossier avec ses hypothèses.</text></g><rect x="72" y="1345" width="936" height="95" rx="18" fill="#dceccc" /><text x="540" y="1405" font-family="Arial,sans-serif" font-size="32" fill="#143c33" text-anchor="middle" font-weight="700">Essayer l’outil gratuit  →</text><text x="540" y="1495" font-family="Arial,sans-serif" font-size="30" fill="#c3d6c5" text-anchor="middle">Outil gratuit · import local</text><text x="540" y="1540" font-family="Arial,sans-serif" font-size="30" fill="#c3d6c5" text-anchor="middle">Sources et hypothèses à vérifier · aucune vente prédite</text></svg>