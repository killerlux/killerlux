<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Aymen Kouskoussi, Application Security Engineer</title>
  <desc id="desc">Dark blue profile banner with a subtle security grid and turquoise accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1f38"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93c5fd" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#background)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="50" r="150" fill="#2dd4bf" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="1140" cy="260" r="130" fill="#3b82f6" fill-opacity="0.13" filter="url(#glow)"/>

  <g fill="none" stroke="url(#accent)" stroke-linecap="round">
    <path d="M1014 72h70l35 60-35 60h-70l-35-60z" stroke-width="3" opacity="0.72"/>
    <path d="M1049 103v58M1024 132h50" stroke-width="6" opacity="0.9"/>
    <circle cx="1049" cy="132" r="10" fill="#0b1f38" stroke-width="4"/>
    <path d="M936 95h32M1131 95h29M936 169h32M1131 169h29" stroke-width="2" opacity="0.5"/>
  </g>

  <rect x="72" y="66" width="66" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="139" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="-1.4">Aymen Kouskoussi</text>
  <text x="74" y="184" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="500" letter-spacing="1.4">APPLICATION SECURITY ENGINEER</text>
  <text x="74" y="227" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">Web &amp; API security  ·  BSCP  ·  Bug bounty research</text>
</svg>
